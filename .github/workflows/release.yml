name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DIST_TAG: el9
  # Fedora 专用的 BuildRequires 名在 Debian runner 上装不出来，工具由步骤自己装。
  RPM_BUILD_NODEPS: "1"

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Read and check version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/check_version.py --expect "$tag"
          version="$(python -c 'import rdpflow; print(rdpflow.__version__)')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: GTK smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            libgtk-4-1 libadwaita-1-0 xvfb libgl1-mesa-dri libegl1

      - name: Run headless UI smoke test
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /usr/bin/python3 -m tests.ui_smoke

  build:
    name: Build ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    needs: [verify, test, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rpm
            script: bash build-rpm.sh
            glob: dist/*.rpm
          - kind: deb
            script: bash build-deb.sh
            glob: dist/*.deb
          - kind: python
            script: |
              python -m pip install --upgrade pip build
              python -m build
            glob: |
              dist/*.whl
              dist/*.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # 可复现构建要拿 commit 时间当 SOURCE_DATE_EPOCH。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev desktop-file-utils python3

      - name: Build artifact
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ${{ matrix.script }}

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*.rpm *.deb *.whl *.tar.gz)
          printf '本次产物：%s\n' "${files[*]}"
          [ "${#files[@]}" -gt 0 ]
          sha256sum "${files[@]}" > "SHA256SUMS.${{ matrix.kind }}"
          cat "SHA256SUMS.${{ matrix.kind }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.kind }}
          path: |
            ${{ matrix.glob }}
            dist/SHA256SUMS.${{ matrix.kind }}
          if-no-files-found: error

  install:
    name: Install check (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            query: dpkg -s rdpflow
            bindir: /usr/lib
          - distro: fedora
            image: fedora:latest
            query: rpm -q rdpflow
            bindir: /usr/libexec
    container: ${{ matrix.image }}
    # 容器里的默认 shell 是 sh，`set -euo pipefail` 会直接报 Illegal option。
    defaults:
      run:
        shell: bash
    steps:
      # 从 tag 重新构建：容器里就是目标发行版，依赖解析走真实仓库。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build tooling
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends dpkg-dev python3 git tar gzip
          else
            dnf install -y rpm-build desktop-file-utils python3 tar gzip diffutils git
          fi

      - name: Build package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            bash build-deb.sh
          else
            # 容器里就是 Fedora：让 rpmbuild 自己去解析 BuildRequires。
            unset RPM_BUILD_NODEPS
            bash build-rpm.sh
          fi

      - name: Install with dependency resolution
        run: |
          set -euo pipefail
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            # apt 只认 ./ 开头的本地路径，裸 glob 会报 Unsupported file。
            cd dist && apt-get install -y ./*.deb
          else
            dnf install -y dist/*.rpm
          fi
          ${{ matrix.query }}
          test -x /usr/bin/rdpflow
          test -f ${{ matrix.bindir }}/rdpflow/layout.py

      - name: Installed package imports GTK and reports its version
        env:
          XDG_CONFIG_HOME: /tmp/xdg
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "${{ matrix.bindir }}")
          import rdpflow
          print("installed version:", rdpflow.__version__)
          import rdpflow.ui
          print("gtk import ok:", rdpflow.ui.__name__)
          PY

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [verify, build, install]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( \
                -name '*.rpm' -o -name '*.deb' -o -name '*.whl' \
                -o -name '*.tar.gz' -o -name '*.sha256' \) \
              -exec cp -v {} release/ \;
          cd release
          rm -f SHA256SUMS SHA256SUMS.tmp
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "RDPFlow $version" > notes.md
          fi
          {
            echo "## 安装"
            echo
            echo '**Fedora / RHEL:**'
            echo '```bash'
            echo "sudo dnf install ./rdpflow-${version}-1.el9.noarch.rpm"
            echo '```'
            echo
            echo '**Debian / Ubuntu:**'
            echo '```bash'
            echo "sudo apt install ./rdpflow_${version}-1_all.deb"
            echo '```'
            echo
            echo '**Python 包：**'
            echo '```bash'
            echo "pip install rdpflow-${version}-py3-none-any.whl"
            echo '```'
            echo
            echo "全部产物校验：\`sha256sum -c SHA256SUMS\`"
            echo
            echo "---"
            echo
          } > header.md
          cat header.md notes.md > release-notes.md
          cat release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" release/* \
              --title "RDPFlow ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  confirm:
    name: Confirm release is complete
    runs-on: ubuntu-24.04
    needs: [verify, publish]
    steps:
      - name: Every expected asset is attached and non-empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh 默认从 git remote 里找仓库；这个 job 不 checkout，必须显式给。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isDraft,assets --jq '
            "tag=\(.tagName) draft=\(.isDraft)",
            (.assets[] | "  \(.name)\t\(.size) bytes")
          '
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=0
          for want in \
              "rdpflow-${VERSION}-1.el9.noarch.rpm" \
              "rdpflow_${VERSION}-1_all.deb" \
              "rdpflow-${VERSION}-py3-none-any.whl" \
              "rdpflow-${VERSION}.tar.gz" \
              "SHA256SUMS"; do
            if ! grep -qx "$want" <<< "$assets"; then
              echo "::error::release $TAG 缺少产物 $want"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "release $TAG 产物齐全：$(wc -l <<< "$assets") 个文件"
