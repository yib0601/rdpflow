name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DIST_TAG: el9
  # Fedora 专用的 BuildRequires 名在 Debian runner 上装不出来，工具由步骤自己装。
  RPM_BUILD_NODEPS: "1"

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: version
        name: Read and check version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/check_version.py --expect "$tag"
          version="$(python -c 'import rdpflow; print(rdpflow.__version__)')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: CLI answers --version and --help without a display
        run: |
          python -m rdpflow --version
          python -m rdpflow --help

  smoke:
    name: GTK smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            libgtk-4-1 libadwaita-1-0 xvfb libgl1-mesa-dri libegl1

      - name: Run headless UI smoke test
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /usr/bin/python3 -m tests.ui_smoke

  # ---------------------------------------------------------------------------
  # Linux 原生包：deb / rpm / 便携包，x86_64 与 arm64 各出一份。
  #
  # arm64 走 GitHub 的原生 ARM runner（ubuntu-24.04-arm，公开仓库免费），不用 qemu
  # 交叉：flatpak-builder 的 --arch 硬性要求宿主兼容（实测 aarch64 目标报
  # bwrap: execvp cmake: Exec format error），而 arm64 容器里的安装检查也必须真执行。
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build ${{ matrix.kind }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, test, smoke]
    strategy:
      fail-fast: false
      matrix:
        # 显式列组合，不用 arch × kind 的笛卡尔积：rpm/deb 是 noarch/all（内容与架构
        # 无关，产两份会同名覆盖），wheel 是 py3-none-any；只有便携包真的需要两个架构
        # 各打一次（它带 uname 出来的架构名，且要在各自的解释器上验自检）。
        include:
          - { kind: rpm, arch: x86_64, runner: ubuntu-24.04 }
          - { kind: deb, arch: x86_64, runner: ubuntu-24.04 }
          - { kind: python, arch: x86_64, runner: ubuntu-24.04 }
          - { kind: portable, arch: x86_64, runner: ubuntu-24.04 }
          - { kind: portable, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
        # arm64 的 runner 也支持 setup-python，不需要系统 python3。

      # deb 是 Architecture: all、rpm 是 BuildArch: noarch —— 内容与架构无关，
      # 两个架构各产一份只会得到同名同内容的文件；跨架构的真实性交给 install 作业：
      # 在 arm64 容器里从 tag 重建、安装、跑 --self-check。
      - name: Install distro tooling
        if: matrix.kind != 'python'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev desktop-file-utils python3 python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Build deb
        if: matrix.kind == 'deb'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          # Architecture: all —— 纯 Python，不许按 runner 架构取名，否则同一份内容
          # 会以 rdpflow_x.y.z-1_amd64.deb 与 _arm64.deb 两个名字进 Release。
          ARCH: all
        run: bash build-deb.sh

      - name: Build rpm
        if: matrix.kind == 'rpm'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash build-rpm.sh

      - name: Build portable tarball
        if: matrix.kind == 'portable'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-portable.sh

      - name: Build wheel and sdist
        if: matrix.kind == 'python'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # 自检是唯一能证明"这份产物真能起来"的证据：解包/安装后立刻跑 --self-check，
      # 无头也能跑（它不创建窗口），缺 typelib 或 FreeRDP 会直接非零退出。
      - name: Self-check the built deb
        if: matrix.kind == 'deb'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # 依赖走真实仓库解析：这一步同时验证了 Depends 写得对不对。
          sudo apt-get install -y --no-install-recommends ./dist/*.deb
          rdpflow --version
          rdpflow --self-check
          python3 -c 'import sys; sys.path.insert(0, "/usr/lib"); import rdpflow; print(rdpflow.__version__)'

      - name: Self-check the built rpm
        if: matrix.kind == 'rpm'
        run: |
          set -euo pipefail
          if ! command -v dnf >/dev/null 2>&1; then
            echo "rpm 已构建，此 runner 不是 Fedora，安装检查在 install 作业里做"
            rpm -qpi dist/*.rpm
            exit 0
          fi
          sudo dnf install -y dist/*.rpm
          rdpflow --version
          rdpflow --self-check

      - name: Install FreeRDP for the portable check
        if: matrix.kind == 'portable'
        run: |
          # 便携包是"自带 Python 代码、用宿主的 GTK 与 FreeRDP"，自检会去找 xfreerdp3。
          # ubuntu runner 不预装 FreeRDP，不装它自检必然报「未找到 FreeRDP」。
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends freerdp3-x11 \
            || sudo apt-get install -y --no-install-recommends freerdp2-x11

      - name: Self-check the portable tree
        if: matrix.kind == 'portable'
        run: |
          set -euo pipefail
          cd dist
          tar xzf ./*.tar.gz
          # 末尾的 / 只匹配目录：dist/ 里还有 rdpflow-<v>-linux-<arch>.tar.gz
          # 和它的 .sha256，不带 / 时 cd 会收到三个参数并报「参数太多」（实测）。
          cd rdpflow-*-linux-*/
          # 必须指定系统解释器：actions/setup-python 装的 3.13 排在 PATH 最前，
          # 它没有 PyGObject，直接用就报 No module named 'gi'（实测）。
          # 便携包本来也不自带 GTK，靠的就是宿主的 python3-gi。
          export RDPFLOW_PYTHON=/usr/bin/python3
          ./self-check.sh
          ./bin/rdpflow --version

      - name: Self-check the wheel in a clean venv
        if: matrix.kind == 'python'
        run: |
          set -euo pipefail
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python -c 'import pathlib, rdpflow
          package = pathlib.Path(rdpflow.__file__).parent
          print("installed", rdpflow.__version__, package)
          for name in ("assets/style.css", "assets/rdpflow.svg", "layout.py", "ui.py", "runtime.py"):
              assert (package / name).is_file(), name'
          /tmp/venv/bin/rdpflow --version

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=()
          case "${{ matrix.kind }}" in
            rpm) files=(*.rpm) ;;
            deb) files=(*.deb) ;;
            portable) files=(rdpflow-*-linux-*.tar.gz) ;;
            python) files=(*.whl rdpflow-[0-9]*.tar.gz) ;;
          esac
          printf '本次产物：%s\n' "${files[*]}"
          [ "${#files[@]}" -gt 0 ]
          sha256sum "${files[@]}" > "SHA256SUMS.${{ matrix.kind }}-${{ matrix.arch }}"
          cat "SHA256SUMS.${{ matrix.kind }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.kind }}-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.*
          if-no-files-found: error
          # 各 kind 只产出自己那一种，其余 glob 命中为空是正常的
          overwrite: true

  # ---------------------------------------------------------------------------
  # Flatpak：单文件 bundle，x86_64 与 aarch64 各一份。
  # ---------------------------------------------------------------------------
  build-flatpak:
    name: Build flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, test, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # elfutils 提供 eu-strip：flatpak-builder 在导出阶段用它拆 debuginfo，
          # 缺了就报 module freerdp: Failed to execute child process "eu-strip"。
          # librsvg2-common 提供 SVG 的 gdk-pixbuf 加载器：appstreamcli compose 要把
          # 应用图标栅格化成 media 里的 PNG，加载器缺失时 SVG 读不出来，只剩
          # file-read-error + filters-but-no-output（在 ubuntu:24.04 容器里加/不加
          # 这个包做差分，结论是它决定了 compose 成不成）。
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common curl

      - name: Install GNOME runtime and SDK
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51

      # appstreamcli compose 在导出元数据时要栅格化图标，它用 bubblewrap 起 glycin
      # 图像加载器。ubuntu-24.04 默认 apparmor_restrict_unprivileged_userns=1，
      # bwrap 起不来，compose 就报 file-read-error + filters-but-no-output（本地用
      # 一个假的 bwrap 就能复现出这两条一模一样的错误）。arm64 runner 的镜像没开
      # 这条限制，所以只有 x86_64 红——不是架构问题。
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "没有这条 sysctl（内核未启用该限制），跳过"
          # 冒烟必须让 bwrap 真的跑完一条命令才叫通过：--unshare-all + / 只读绑定
          # 在任何发行版上都成立，别写 --ro-bind /usr 之类的局部绑定（路径不齐时
          # bwrap 会以 execvp 失败退出，而那个失败与命名空间无关）。
          bwrap --unshare-all --die-with-parent --ro-bind / / --dev /dev \
            --proc /proc /bin/true
          echo "bwrap 可用"

      - name: Build bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-flatpak.sh

      # 装进本机再跑一次自检：bundle 里若缺 FreeRDP 或 typelib，这一步才会暴露。
      - name: Install bundle and self-check
        run: |
          set -euo pipefail
          bundle="$(ls dist/*.flatpak)"
          flatpak install --user -y --noninteractive "$bundle"
          flatpak run io.github.rdpflow.RDPFlow --version
          flatpak run io.github.rdpflow.RDPFlow --self-check
          flatpak run io.github.rdpflow.RDPFlow --self-check | grep -q '"ok": true'
          flatpak uninstall --user -y io.github.rdpflow.RDPFlow

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.flatpak > "SHA256SUMS.flatpak-${{ matrix.arch }}"
          cat "SHA256SUMS.flatpak-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: |
            dist/*.flatpak
            dist/SHA256SUMS.flatpak-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # AppImage：单文件、自带运行时（GTK4 / libadwaita / PyGObject / FreeRDP）。
  #
  # 在容器里装配：兼容性上限由构建镜像的 glibc 决定，不能用 runner 自带的那套。
  # 自检必须在「跑之前把 GTK 全套卸掉」的机器上做——否则测的是 runner 的库，
  # 而不是包里那份，缺文件也照样过。
  # ---------------------------------------------------------------------------
  build-appimage:
    name: Build appimage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, test, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build AppImage
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-appimage.sh

      # AppImage 的整个卖点是「裸系统也能跑」，所以在另一个容器里验收：
      # runner 上装着 GTK4 / PyGObject / FreeRDP，就地跑 --self-check 会静默用宿主的库，
      # 包里少什么都不会红（本地实测过：整套 GTK 都没进包时，本机自检依然通过）。
      # scripts/verify-appimage.sh 会先断言容器里一个相关包都没有，再跑自检和 GUI 冒烟。
      - name: Self-check the AppImage on a bare system
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 true 2>/dev/null || {
            echo "::error::runner 上没有可用的 docker"; exit 1; }
          bash scripts/verify-appimage.sh dist/*.AppImage

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.AppImage > "SHA256SUMS.appimage-${{ matrix.arch }}"
          cat "SHA256SUMS.appimage-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.appimage-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows：MSYS2 UCRT64/CLANGARM64 里 PyInstaller → Inno Setup。
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build windows exe (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            allowed: x64compatible
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            allowed: arm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # 包名逐个核对过（MSYS2 的 .files 数据库）：
          #  - PyGObject 的包名是 python-gobject，没有 pygobject 这个名字；
          #  - cairo-1.0.typelib 由 gobject-introspection-runtime 提供，不在 cairo 包里；
          #  - Secret-1.typelib 确实在 libsecret 里（没有它只是无法记住密码，不致命）；
          #  - freerdp 提供 wfreerdp.exe（Win32 客户端），是本程序在 Windows 上的后端。
          install: >-
            git
            unzip
            zip
            ${{ matrix.prefix }}-python
            ${{ matrix.prefix }}-pyinstaller
            ${{ matrix.prefix }}-python-gobject
            ${{ matrix.prefix }}-gobject-introspection-runtime
            ${{ matrix.prefix }}-python-cairo
            ${{ matrix.prefix }}-gtk4
            ${{ matrix.prefix }}-libadwaita
            ${{ matrix.prefix }}-libsecret
            ${{ matrix.prefix }}-freerdp
            ${{ matrix.prefix }}-gdk-pixbuf2
            ${{ matrix.prefix }}-adwaita-icon-theme
            ${{ matrix.prefix }}-hicolor-icon-theme
            ${{ matrix.prefix }}-glib-networking

      - name: Report the MSYS2 environment
        run: |
          uname -a
          python3 -V
          pkg-config --modversion gtk4 libadwaita-1 2>/dev/null || true
          which wfreerdp
          # PyInstaller 的二进制依赖分析只搜 PATH；不在 PATH 里的 DLL 会被静默漏收，
          # 结果就是用户机器上 status c0000135 启动即死。这里是硬前提。
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          case ":$PATH:" in
            *":$MINGW_PREFIX/bin:"*) echo "PATH ok" ;;
            *) export PATH="$MINGW_PREFIX/bin:$PATH"; echo "PATH 已补齐（写进 GITHUB_ENV）"
               echo "$MINGW_PREFIX/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build exe
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash build-windows.sh

      - name: Smoke test the installer is a valid PE
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/rdpflow-*-windows-*.exe | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)[0..1]
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "$($exe.Name) 不是合法 PE 文件"
          }
          Write-Host "$($exe.Name) $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*-windows-*.exe ./*-windows-*-portable.zip > "SHA256SUMS.windows-${{ matrix.arch }}"
          cat "SHA256SUMS.windows-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/*-windows-*.exe
            dist/*-windows-*-portable.zip
            dist/SHA256SUMS.windows-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 真实安装检查：在目标发行版容器里装、导入、卸载。
  # ---------------------------------------------------------------------------
  install:
    name: Install check (${{ matrix.distro }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            arch: x86_64
            runner: ubuntu-24.04
            image: ubuntu:24.04
            query: dpkg -s rdpflow
            bindir: /usr/lib
          - distro: fedora
            arch: x86_64
            runner: ubuntu-24.04
            image: fedora:latest
            query: rpm -q rdpflow
            bindir: /usr/libexec
          - distro: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            query: dpkg -s rdpflow
            bindir: /usr/lib
          - distro: fedora
            arch: arm64
            runner: ubuntu-24.04-arm
            image: fedora:latest
            query: rpm -q rdpflow
            bindir: /usr/libexec
    container: ${{ matrix.image }}
    # Fedora 容器里要 rpmbuild 自己解析 BuildRequires，必须把全局的 --nodeps 关掉；
    # Ubuntu 容器里没装 Fedora 的包名，仍然要靠 --nodeps。
    env:
      RPM_BUILD_NODEPS: ${{ matrix.distro == 'fedora' && '' || '1' }}
    defaults:
      run:
        shell: bash
    steps:
      # 从 tag 重新构建：容器里就是目标发行版，依赖解析走真实仓库。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build tooling
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends dpkg-dev python3 git tar gzip
          else
            dnf install -y rpm-build desktop-file-utils python3 tar gzip diffutils git
          fi

      - name: Build package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            bash build-deb.sh
          else
            bash build-rpm.sh
          fi

      - name: Install with dependency resolution
        run: |
          set -euo pipefail
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            cd dist && apt-get install -y ./*.deb
          else
            dnf install -y dist/*.rpm
          fi
          ${{ matrix.query }}
          test -x /usr/bin/rdpflow
          test -f ${{ matrix.bindir }}/rdpflow/layout.py
          test -f ${{ matrix.bindir }}/rdpflow/runtime.py

      - name: Installed package answers --version and --self-check
        env:
          XDG_CONFIG_HOME: /tmp/xdg
        run: |
          set -euo pipefail
          rdpflow --version
          # FreeRDP 由包依赖装进来；自检在这里必须全绿。
          rdpflow --self-check
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "${{ matrix.bindir }}")
          import rdpflow
          print("installed version:", rdpflow.__version__)
          import rdpflow.ui
          print("gtk import ok:", rdpflow.ui.__name__)
          PY

  # ---------------------------------------------------------------------------
  # 汇总
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [verify, build-linux, build-flatpak, build-appimage, build-windows, install]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( \
                -name '*.rpm' -o -name '*.deb' -o -name '*.whl' \
                -o -name '*.flatpak' -o -name '*.AppImage' -o -name '*windows-*.exe' \
                -o -name '*windows-*portable.zip' -o -name '*linux-*.tar.gz' \
                -o -name 'rdpflow-*.tar.gz' \) \
              -exec cp -v {} release/ \;
          # 便携包与 sdist 都是 .tar.gz，同名前缀会互相覆盖——按内容区分：
          # sdist 是 rdpflow-<ver>.tar.gz，便携包是 rdpflow-<ver>-linux-<arch>.tar.gz。
          cd release
          ls -la
          rm -f SHA256SUMS SHA256SUMS.tmp
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "RDPFlow $VERSION" > notes.md
          fi
          # 安装说明用 python 生成：里面全是 Markdown 代码栅栏（三个反引号），
          # 在 bash 里无论单引号还是双引号都别扭 —— 单引号触发 SC2016，双引号更糟：
          # 反引号会被当成命令替换，`bash` 报 command not found（实测）。
          python3 - "$VERSION" <<'PY' > header.md
          import sys

          version = sys.argv[1]
          fence = "`" * 3
          blocks = [
              ("## 安装", ""),
              ("**Fedora / RHEL（x86_64 / aarch64）**", f"sudo dnf install ./rdpflow-{version}-1.el9.noarch.rpm"),
              ("**Debian / Ubuntu（amd64 / arm64）**", f"sudo apt install ./rdpflow_{version}-1_all.deb"),
              ("**Flatpak（x86_64 / aarch64）**", f"flatpak install --user ./io.github.rdpflow.RDPFlow-{version}-x86_64.flatpak"),
              ("**AppImage（x86_64 / aarch64，自带 GTK4 与 FreeRDP）**",
               f"chmod +x ./io.github.rdpflow.RDPFlow-{version}-x86_64.AppImage\n"
               f"./io.github.rdpflow.RDPFlow-{version}-x86_64.AppImage --self-check"),
              ("**便携包（解压即用，Linux x86_64 / arm64）**",
               f"tar xzf rdpflow-{version}-linux-x86_64.tar.gz\n"
               f"./rdpflow-{version}-linux-x86_64/bin/rdpflow --self-check"),
              ("**Python 包**", f"pip install rdpflow-{version}-py3-none-any.whl"),
          ]
          for title, command in blocks:
              print(title)
              if command:
                  print(fence + "bash")
                  print(command)
                  print(fence)
              print()

          print("**Windows（x86_64 / arm64）**")
          print()
          print(f"下载 `rdpflow-{version}-windows-<arch>.exe` 直接安装；不想安装就用")
          print("`-portable.zip` 解压后运行 `RDPFlow.exe`。Windows 版需要系统里能找")
          print("到 `wfreerdp.exe`（FreeRDP 3 的 Win32 客户端），或用 `RDPFLOW_FREERDP`")
          print("指定它的完整路径。")
          print()
          print("任意产物都可先自检：`rdpflow --self-check`（输出 JSON，退出码非零表示")
          print("环境缺依赖，例如缺 GTK typelib 或 FreeRDP）。")
          print()
          print("全部产物校验：`sha256sum -c SHA256SUMS`")
          print()
          print("---")
          print()
          PY
          cat header.md notes.md > release-notes.md
          cat release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # 删过 tag 再推同一个 tag，GitHub 会把已有 release 打回 draft；更新分支
          # 必须显式 --draft=false，否则「发布成功」的 release 其实一直藏着。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --draft=false --notes-file release-notes.md
          else
            gh release create "$TAG" release/* \
              --title "RDPFlow ${TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  confirm:
    name: Confirm release is complete
    runs-on: ubuntu-24.04
    needs: [verify, publish]
    steps:
      - name: Every expected asset is attached and non-empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,isDraft,assets --jq '
            "tag=\(.tagName) draft=\(.isDraft)",
            (.assets[] | "  \(.name)\t\(.size) bytes")
          '
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$draft" != "false" ]; then
            echo "::error::release $TAG 仍是 draft，外部看不到也下载不到"
            exit 1
          fi
          missing=0
          for want in \
              "rdpflow-${VERSION}-1.el9.noarch.rpm" \
              "rdpflow_${VERSION}-1_all.deb" \
              "io.github.rdpflow.RDPFlow-${VERSION}-x86_64.flatpak" \
              "io.github.rdpflow.RDPFlow-${VERSION}-aarch64.flatpak" \
              "io.github.rdpflow.RDPFlow-${VERSION}-x86_64.AppImage" \
              "io.github.rdpflow.RDPFlow-${VERSION}-aarch64.AppImage" \
              "rdpflow-${VERSION}-linux-x86_64.tar.gz" \
              "rdpflow-${VERSION}-linux-arm64.tar.gz" \
              "rdpflow-${VERSION}-windows-x86_64.exe" \
              "rdpflow-${VERSION}-windows-arm64.exe" \
              "rdpflow-${VERSION}-py3-none-any.whl" \
              "rdpflow-${VERSION}.tar.gz" \
              "SHA256SUMS"; do
            if ! grep -qx "$want" <<< "$assets"; then
              echo "::error::release $TAG 缺少产物 $want"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "release $TAG 产物齐全：$(wc -l <<< "$assets") 个文件"
