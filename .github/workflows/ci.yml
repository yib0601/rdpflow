name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_TAG: el9
  # RPM 的 BuildRequires 写的是 Fedora 的包名，在 Debian/Ubuntu runner 上装不出来；
  # 真正需要的东西由各步骤自己装。
  RPM_BUILD_NODEPS: "1"

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm desktop-file-utils

      - name: Byte-compile every module
        run: python -m compileall -q rdpflow tests scripts

      - name: Validate RPM spec
        run: rpmspec -P rdpflow.spec > /dev/null

      - name: Validate desktop entry
        run: desktop-file-validate rdpflow.desktop

      - name: Version is consistent across files
        run: python scripts/check_version.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # 单测不依赖 PyGObject：models / store / freerdp / layout 的纯计算部分都要能在
      # 裸解释器里跑，这正是它们该保持的性质，所以这里刻意用 setup-python 而不是
      # 系统 python3 —— 顺带把「有没有偷偷在 import 期拉 GTK」钉成回归项。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: GTK smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            libgtk-4-1 libadwaita-1-0 xvfb libgl1-mesa-dri libegl1

      - name: Run headless UI smoke test
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # 无显示器：xvfb 起一块 1920x1080 虚拟屏，冒烟脚本自己把四张界面截到 /tmp。
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /usr/bin/python3 -m tests.ui_smoke

      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/rdpflow-*.png
          if-no-files-found: warn

  dist:
    name: Python distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import pathlib, rdpflow
          package = pathlib.Path(rdpflow.__file__).parent
          print("installed", rdpflow.__version__, package)
          for name in ("assets/style.css", "assets/rdpflow.svg", "layout.py", "ui.py"):
              assert (package / name).is_file(), name
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  package:
    name: Package (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        kind: [rpm, deb]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev desktop-file-utils python3

      - name: Build ${{ matrix.kind }} package
        run: |
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            bash build-rpm.sh
          else
            bash build-deb.sh
          fi

      - name: Inspect package
        run: |
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            rpm -qpi dist/*.rpm
            rpm -qpl dist/*.rpm
          else
            dpkg-deb --info dist/*.deb
            dpkg-deb --contents dist/*.deb
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.kind }}
          path: |
            dist/*.${{ matrix.kind }}
            dist/*.${{ matrix.kind }}.sha256
          if-no-files-found: error

  install-deb:
    name: Install deb (ubuntu:24.04)
    runs-on: ubuntu-24.04
    needs: package
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: /tmp/pkg

      - name: Install with dependency resolution
        run: |
          apt-get update
          cd /tmp/pkg
          apt-get install -y --no-install-recommends ./*.deb
          dpkg -s rdpflow | grep -E '^(Status|Version):'
          test -x /usr/bin/rdpflow
          test -f /usr/lib/rdpflow/layout.py
          test -f /usr/share/applications/rdpflow.desktop

      - name: Installed application imports GTK and reports its version
        env:
          XDG_CONFIG_HOME: /tmp/xdg
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "/usr/lib")
          import rdpflow
          print("version:", rdpflow.__version__)
          import rdpflow.ui
          print("ui import ok:", rdpflow.ui.__name__)
          PY

      - name: Remove cleanly
        run: |
          apt-get remove -y rdpflow
          test ! -e /usr/bin/rdpflow

  install-rpm:
    name: Install rpm (fedora:latest)
    runs-on: ubuntu-24.04
    needs: package
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-rpm
          path: /tmp/pkg

      - name: Install with dependency resolution
        run: |
          dnf install -y desktop-file-utils
          dnf install -y /tmp/pkg/*.rpm
          rpm -q rdpflow
          test -x /usr/bin/rdpflow
          test -f /usr/libexec/rdpflow/layout.py
          desktop-file-validate /usr/share/applications/rdpflow.desktop

      - name: Installed application imports GTK and reports its version
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "/usr/libexec")
          import rdpflow
          print("version:", rdpflow.__version__)
          import rdpflow.ui
          print("ui import ok:", rdpflow.ui.__name__)
          PY

      - name: Remove cleanly
        run: |
          dnf remove -y rdpflow
          test ! -e /usr/bin/rdpflow
