name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DIST_TAG: el9
  # RPM 的 BuildRequires 写的是 Fedora 的包名，在 Debian/Ubuntu runner 上装不出来；
  # 真正需要的东西由各步骤自己装。
  RPM_BUILD_NODEPS: "1"

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm desktop-file-utils flatpak flatpak-builder appstream

      - name: Byte-compile every module
        run: python -m compileall -q rdpflow tests scripts

      - name: Packaging scripts are valid shell
        run: |
          # AppImage/Flatpak 这两条最容易出语法错（heredoc + 嵌套引号），先纯语法检查，
          # 不用等到打标签才发现。
          for script in build-*.sh; do
            bash -n "$script"
            echo "$script ok"
          done

      - name: Validate RPM spec
        run: rpmspec -P rdpflow.spec > /dev/null

      - name: Validate desktop entry
        run: |
          desktop-file-validate io.github.rdpflow.RDPFlow.desktop flatpak/io.github.rdpflow.RDPFlow.desktop
          # 源 desktop 文件必须已经带着正确的 Icon= 名：打包脚本只是替换 Exec，
          # 不再 sed 改 Icon，漏改就会让人装完只有兜底图标。
          grep -qx 'Icon=io.github.rdpflow.RDPFlow' io.github.rdpflow.RDPFlow.desktop

      - name: Validate AppStream metadata
        run: |
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net io.github.rdpflow.RDPFlow.metainfo.xml

      - name: Validate the Flatpak manifest parses
        run: |
          # flatpak-builder --show-manifest 只做解析与 schema 检查，不下载、不构建，
          # 几秒钟就能挡住 YAML 缩进错、字段名写错这类问题。
          flatpak-builder --show-manifest io.github.rdpflow.RDPFlow.yml > /tmp/manifest.json
          python3 -c 'import json; d = json.load(open("/tmp/manifest.json"))
          print("modules:", [m["name"] for m in d["modules"]])
          # --show-manifest 输出的是规范化后的 JSON，顶层键是 id 而不是 app-id。
          assert d["id"] == "io.github.rdpflow.RDPFlow"'

      - name: Windows packaging files are syntactically sound
        run: |
          python3 -m py_compile packaging/windows/entry.py packaging/windows/runtime_hook.py
          python3 - <<'PY'
          import ast
          import pathlib

          for name in ("rdpflow.spec.windows", "packaging/windows/entry.py",
                       "packaging/windows/runtime_hook.py"):
              ast.parse(pathlib.Path(name).read_text(encoding="utf-8"))
              print(name, "parses")
          PY

      - name: Translations are complete and compiled
        run: |
          # 两条硬门禁：
          #   1) po/en.po 覆盖源码里每一条 _()（漏翻 = 界面中英混杂）；
          #   2) 仓库里提交的 .mo 与 .po 一致（改完文案忘了重新编译 = 装了包还是旧文案）。
          python scripts/build-locales.py --check
          python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("bl", "scripts/build-locales.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          entries, _ = module.read_po(pathlib.Path("po/en.po"))
          compiled = module.mo_path("en")
          assert compiled.is_file(), "rdpflow/locale/en/LC_MESSAGES/rdpflow.mo 缺失，运行 scripts/build-locales.py"
          assert compiled.read_bytes() == module.compile_mo(entries, "en"), "rdpflow.mo 与 po/en.po 不同步"
          print("locale catalogs up to date:", compiled)
          PY

      - name: Version is consistent across files
        run: python scripts/check_version.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # 单测不依赖 PyGObject：models / store / freerdp / layout 的纯计算部分都要能在
      # 裸解释器里跑，这正是它们该保持的性质，所以这里刻意用 setup-python 而不是
      # 系统 python3 —— 顺带把「有没有偷偷在 import 期拉 GTK」钉成回归项。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  smoke:
    name: GTK smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 \
            libgtk-4-1 libadwaita-1-0 xvfb libgl1-mesa-dri libegl1

      - name: Run headless UI smoke test
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # 无显示器：xvfb 起一块 1920x1080 虚拟屏，冒烟脚本自己把四张界面截到 /tmp。
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /usr/bin/python3 -m tests.ui_smoke

      - name: Collect screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/rdpflow-*.png
          if-no-files-found: warn

  dist:
    name: Python distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import pathlib, rdpflow
          package = pathlib.Path(rdpflow.__file__).parent
          print("installed", rdpflow.__version__, package)
          for name in ("assets/style.css", "assets/rdpflow.svg", "layout.py", "ui.py"):
              assert (package / name).is_file(), name
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  package:
    name: Package (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        kind: [rpm, deb]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm dpkg-dev desktop-file-utils python3

      - name: Build ${{ matrix.kind }} package
        run: |
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            bash build-rpm.sh
          else
            bash build-deb.sh
          fi

      - name: Inspect package
        run: |
          if [ "${{ matrix.kind }}" = "rpm" ]; then
            rpm -qpi dist/*.rpm
            rpm -qpl dist/*.rpm
          else
            dpkg-deb --info dist/*.deb
            dpkg-deb --contents dist/*.deb
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.kind }}
          path: |
            dist/*.${{ matrix.kind }}
            dist/*.${{ matrix.kind }}.sha256
          if-no-files-found: error

  install-deb:
    name: Install deb (ubuntu:24.04)
    runs-on: ubuntu-24.04
    needs: package
    container: ubuntu:24.04
    # 容器里的默认 shell 是 sh，`set -euo pipefail` 会直接报 Illegal option。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: /tmp/pkg

      - name: Install with dependency resolution
        run: |
          apt-get update
          cd /tmp/pkg
          apt-get install -y --no-install-recommends ./*.deb
          dpkg -s rdpflow | grep -E '^(Status|Version):'
          test -x /usr/bin/rdpflow
          test -f /usr/lib/rdpflow/layout.py
          test -f /usr/share/applications/io.github.rdpflow.RDPFlow.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.rdpflow.RDPFlow.svg

      - name: Installed application actually runs
        env:
          XDG_CONFIG_HOME: /tmp/xdg
        run: |
          set -euo pipefail
          # 必须执行真命令，而不是自己往 sys.path 里塞路径再 import：
          # 启动器里的 sys.path 插错一级（插 /usr/lib/rdpflow 而不是 /usr/lib）时，
          # 这种"自造路径的 import 检查"照样通过，用户那边却一启动就
          # ModuleNotFoundError. 实测踩过。
          rdpflow --version
          rdpflow --self-check
          rdpflow --help > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "/usr/lib")
          import rdpflow
          print("version:", rdpflow.__version__)
          import rdpflow.ui
          print("ui import ok:", rdpflow.ui.__name__)
          PY

      - name: Remove cleanly
        run: |
          apt-get remove -y rdpflow
          test ! -e /usr/bin/rdpflow

  install-rpm:
    name: Install rpm (fedora:latest)
    runs-on: ubuntu-24.04
    needs: package
    container: fedora:latest
    # 容器里的默认 shell 是 sh，`set -euo pipefail` 会直接报 Illegal option。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-rpm
          path: /tmp/pkg

      - name: Install with dependency resolution
        run: |
          dnf install -y desktop-file-utils
          dnf install -y /tmp/pkg/*.rpm
          rpm -q rdpflow
          test -x /usr/bin/rdpflow
          test -f /usr/libexec/rdpflow/layout.py
          desktop-file-validate /usr/share/applications/io.github.rdpflow.RDPFlow.desktop

      - name: Installed application actually runs
        run: |
          set -euo pipefail
          rdpflow --version
          rdpflow --self-check
          rdpflow --help > /dev/null
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "/usr/libexec")
          import rdpflow
          print("version:", rdpflow.__version__)
          import rdpflow.ui
          print("ui import ok:", rdpflow.ui.__name__)
          PY

      - name: Remove cleanly
        run: |
          dnf remove -y rdpflow
          test ! -e /usr/bin/rdpflow
