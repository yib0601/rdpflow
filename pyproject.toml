[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rdpflow"
dynamic = ["version"]
description = "Native GTK 4 RDP connection workspace for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "RDPFlow contributors" }]
keywords = ["rdp", "freerdp", "gtk4", "libadwaita", "remote-desktop", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/yib0601/rdpflow"
Issues = "https://github.com/yib0601/rdpflow/issues"
Changelog = "https://github.com/yib0601/rdpflow/blob/main/CHANGELOG.md"

[project.scripts]
rdpflow = "rdpflow.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "rdpflow.__version__" }

[tool.setuptools.packages.find]
include = ["rdpflow*"]

[tool.setuptools.package-data]
rdpflow = ["assets/*.css", "assets/*.svg"]
